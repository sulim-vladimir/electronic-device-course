  goal: "The design passes a final check, your mentor agrees, and 5 prototype boards are ordered.",
  why: `<p>A mistake found now costs nothing. A mistake found after manufacturing costs money and weeks of waiting. Order a small batch of prototypes first: almost nobody gets the first board perfect.</p>`,
  tasks: [
    `<p>Go through the checklist below. Fix anything that fails, then check again.</p>
<ul>
<li>ERC: no new errors. DRC: 0 errors, 0 unconnected, parity OK.</li>
<li>No copper under the ESP antenna, on both layers.</li>
<li>Battery holder polarity: the + mark on the silkscreen matches the holder.</li>
<li>Every connector is keyed or can't be confused with another, and its pinout is on the silkscreen.</li>
<li>Silkscreen has the name, "v2" and the date, so you can tell boards apart later.</li>
<li>Board outline, mounting holes and connectors fit the sample enclosure from step {{enc}} (paper test).</li>
<li>All BOM parts are in stock. The placement preview is correct.</li>
<li>The firmware compiles.</li>
<li>You know the total price.</li>
</ul>`,
    `<p>Show the design and the quote to your mentor. They may also ask Claude to review the files.</p>`,
    `<p>After your mentor merges this step's pull request, mark the exact version you are ordering with a git <b>tag</b>:</p>
<pre><code>git switch main
git pull
git tag v2-proto-1
git push --tags</code></pre>`,
    `<p>Your mentor pays and places the order. Write the order number and date in your submission file.</p>`
  ],
  hints: [
    `A tag is a name for one commit. If you find a problem on the boards later, <code>git switch --detach v2-proto-1</code> shows you exactly what was ordered.`,
    `Print nothing: take screenshots of the 3D view, top and bottom, and put them in your submission file for the review.`
  ],
  done: ["Every item on the checklist passes", "My mentor reviewed and agreed", "Tag v2-proto-1 is pushed", "Order placed (number in my submission file)"],
  commit: `git tag v2-proto-1 && git push --tags`
},
{
  id: "s16", phase: "Prototype", title: "Bring the prototype to life", time: "3–4 h",
  goal: "Every function of the prototype is tested, and every problem is written down.",
  why: `<p>The first power-on is exciting, and also the moment things can burn. Test step by step, from "no power" to "everything on". Write down every problem: that list becomes v3.</p>
  <p><b>Safety:</b> Li-ion batteries can get very hot when shorted. Don't leave a board with a battery unattended while testing. Ask your mentor to be there for the first power-on.</p>`,
  tasks: [
    `<p><b>Look first.</b> With a magnifier: solder bridges between pins, missing parts, parts turned the wrong way.</p>`,
    `<p><b>Measure before power.</b> With a multimeter on resistance (Ω): between 3V3 and GND, and between B+ and GND. Close to 0 Ω means a short. Don't connect power until you find it.</p>`,
    `<p><b>First power.</b> If you have a lab power supply: 3.7 V with the current limit at 200 mA, instead of a battery. Measure 3V3: it should be 3.2–3.4 V.</p>`,
    `<p>Solder the hand-solder parts.</p>`,
    `<p><b>Flash the firmware</b> with a USB-UART adapter set to <b>3.3 V</b>: adapter GND → J3 pin 1, adapter TX → J3 pin 2, adapter RX → J3 pin 3. Hold <b>Flash</b>, tap <b>Reset</b>, release <b>Flash</b>, then Upload in Arduino IDE.</p>`,
    `<p><b>Test each function</b> with the Serial Monitor at 115200 baud: config portal with the Mode jumper, Wi-Fi connect, temperature, pressure, battery voltage (compare with the multimeter), data on the server, Telegram message, wake-up after 30 s.</p>`,
    `<p><b>Measure the sleep current</b> (see hints). Write it in your submission file and compare with step {{s4}}.</p>`,
    `<p>Set the sleep time back to 10 minutes. Write every problem into <code>meteo-v2/ISSUES.md</code> (what, how to see it, photo).</p>`
  ],
  hints: [
    `Sleep current: put the multimeter in series with the battery, on the mA range. When the board sleeps, switch to the µA range. If you start on µA, the meter's resistance can make the ESP reset when it wakes and needs 80 mA.`,
    `If uploading fails: check that TX and RX are crossed correctly, that the adapter is at 3.3 V, and that you entered flash mode (Flash held during reset).`,
    `If the ESP keeps restarting, look at the Serial Monitor at 74880 baud: the ESP prints its boot messages at that speed.`
  ],
  done: ["Visual check and short check done", "3V3 measured correctly", "Firmware flashed and every function tested", "Sleep current measured", "ISSUES.md lists every problem"],
  commit: `git commit -am "Prototype test results"`
},
{
  id: "s17", phase: "Prototype", title: "From prototype to small series", time: "many hours", gate: true,
  goal: "A plan to make and sell a small series, agreed with your mentor.",
  why: `<p>A working prototype is a big step. A product also needs a box, instructions, a test for every unit, a price, and rules to follow when you sell electronics. This step collects all of that.</p>`,
  tasks: [
    `<p><b>v3:</b> copy <code>meteo-v2</code> to a new folder <code>meteo-v3</code> (keep v2 unchanged: it is what you ordered). Fix the problems from <code>ISSUES.md</code> in v3, and go through steps {{s13}}–{{s16}} again. Repeat until there are no serious issues.</p>`,
    `<p><b>Field test:</b> put a prototype in its enclosure outside for at least a week. Does water get in? Is there condensation inside? Compare the temperature with a reference thermometer in the shade. Fix what you find in v3.</p>`,
    `<p><b>Test procedure:</b> a short checklist every unit must pass before you sell it (power, Wi-Fi, sensors, sleep current).</p>`,
    `<p><b>User manual:</b> how to set up Wi-Fi (Mode jumper and the config page), how to charge, and safety notes for the battery.</p>`,
    `<p><b>Cost per unit:</b> board + assembly + hand-soldered parts + battery + enclosure + shipping. Then decide a price.</p>`,
    `<p><b>With your mentor:</b> the rules for selling electronics with Wi-Fi and lithium batteries where you live (conformity marking, battery shipping rules). Don't skip this.</p>`
  ],
  hints: [
    `Search "Stevenson screen" or "radiation shield 3D print" for sensor enclosures.`,
    `The ESP-12F module has its own radio certification, but the finished product may still need its own declaration. Your mentor can find out what applies.`
  ],
  done: ["v3 problems fixed and reviewed", "Test procedure written", "User manual draft written", "Cost per unit and price in my submission file", "Mentor agreed with the selling plan"],
  commit: null
}
];

/* What each step's submission file asks for. NN becomes the step number. */
const DELIVER = {
  s0: ["What you want to learn most from this project"],
  s1: ["Your KiCad version (Help → About KiCad)", "A screenshot of the board in the 3D viewer: <code>img/step-NN-3d.png</code>"],
  s2: ["Your own words: repository, commit, branch, remote, push, pull request, merge", "What <code>git status</code> showed before and after <code>git rm --cached</code>", "Anything that was hard or confusing"],
  s3: ["A table: every part and what it does, block by block", "Your answers to questions 1–6, with calculations", "One thing you would change or don't understand"],
  s4: ["The RESET voltage with R14 = 1 kΩ and with 10 kΩ, with the calculation", "The average current and battery life, with the calculation", "Why R14 is there, in 2–3 sentences", "What you would change to make the battery last longer"],
  s5: ["The board size (width × height in mm)", "The DRC result: number of errors, warnings and unconnected items", "Track, via and zone in your own words", "A screenshot with one net highlighted: <code>img/step-NN-net.png</code>"],
  prac: ["The practice project in <code>course/practice/</code>", "The DRC report: in the DRC window click <b>Save...</b> and save it as <code>course/submissions/step-NN-drc.rpt</code>", "A 3D screenshot: <code>img/step-NN-3d.png</code>", "What was hardest, and one thing you learned"],
  s6: ["Which two nets touch, and at which pad", "Why it would break the station", "A screenshot of the short: <code>img/step-NN-short.png</code>"],
  s7: ["What you changed in the schematic", "The ERC result before and after (number of errors and warnings)"],
  s8: ["What you changed on the PCB", "The DRC report: <code>course/submissions/step-NN-drc.rpt</code>", "3D screenshots of the top and bottom: <code>img/step-NN-top.png</code>, <code>img/step-NN-bottom.png</code>"],
  s9: ["Your resistor values and the calculation: ADC voltage at 4.2 V and 4.3 V, and the current", "B+ or VBAT, and why", "The DRC report: <code>course/submissions/step-NN-drc.rpt</code>"],
  s10: ["Your datasheet table for the HT7333 and one alternative", "Your decision and the reason", "If you changed it: the ERC and DRC results"],
  s11: ["Pros and cons of options A, B and C", "The decision and the reason (discuss it with your mentor in the pull request)", "The DRC report: <code>course/submissions/step-NN-drc.rpt</code>"],
  enc: ["Your requirements list", "A comparison table of 2–3 boxes, with links and prices", "The box you chose, and why", "A photo of the paper test in the sample box: <code>img/step-NN-paper.jpg</code>", "The DRC report: <code>course/submissions/step-NN-drc.rpt</code>"],
  therm: ["Three things that make an air temperature reading wrong", "Your decisions for questions 1–6, each with a reason", "A comparison table for how the cable leaves the box", "Your experiment results (if you did it)", "The parts list: probe, gland or connector, cable length", "What changed in the schematic and PCB, and the DRC report: <code>course/submissions/step-NN-drc.rpt</code>"],
  con: ["Your connection table, with the chosen connector and the reason for each", "Which connections could be confused, and how you prevented it", "The mating parts list", "The DRC report: <code>course/submissions/step-NN-drc.rpt</code>"],
  s12: ["What you changed in the code, and why", "A screenshot of a successful Verify (compile): <code>img/step-NN-compile.png</code>"],
  s13: ["The BOM exported as CSV: <code>course/submissions/step-NN-bom.csv</code>", "Which parts the factory solders and which you solder by hand", "The parts cost per board"],
  s14: ["The production files (the folder the plugin made), committed in the repo", "Screenshots of the JLCPCB placement preview and the price", "Which parts needed a rotation fix"],
  s15: ["The final checklist: each item, and how you checked it", "3D screenshots of the top and bottom", "The total price"],
  s16: ["A measurements table: 3V3, sleep current, battery voltage (board vs multimeter)", "The result of each function test", "<code>meteo-v2/ISSUES.md</code> with every problem you found", "Photos of the assembled board"],
  s17: ["The test procedure for each unit", "The user manual draft", "The cost per unit and the price", "The field test results"]
};

/* "Common problems" tables. */
const PCB_TROUBLE = [
  ["Clearance violation", "A track, via or pad is too close to something on another net. Move the track away or route it another way."],
  ["Unconnected items", "A ratsnest line is still there: a connection isn't routed, or a track ends next to the pad instead of on it. Route it, or drag the track end onto the pad's centre."],
  ["Track has unconnected end", "A leftover piece of track. Select it and press Delete."],
  ["Via is not connected", "A via with a track on only one side (or none). Delete it, or connect both sides."],
  ["Courtyard overlap", "Two parts are too close for the assembly machine. Move them apart."],
  ["Board edge clearance", "Copper is too close to the board edge. Move it inward."],
  ["Items shorting two nets", "Two different nets touch. This is a real fault. Find it and reroute."],
  ["Silkscreen over pad / clipped", "Text lies on a pad and won't print there. Move the text. (A warning, not an error.)"],
  ["The zone looks old or has holes", "Press B to refill all zones after you move things."],
  ["The router stops and won't go further", "The way is blocked. Try another path, drop a via (V) to the other layer, or change the router mode in Route → Interactive Router Settings."]
];
const TROUBLE = { prac: PCB_TROUBLE, s8: PCB_TROUBLE, s9: PCB_TROUBLE };

/* "Learn more" links: official documentation only. */
const KICAD_DOCS = ["KiCad documentation (Getting Started, Schematic Editor, PCB Editor)", "https://docs.kicad.org/"];
const LEARN = {
  s1: [KICAD_DOCS],
  s2: [["Pro Git (free book): chapters 1–3", "https://git-scm.com/book/en/v2"], ["GitHub Docs: pull requests", "https://docs.github.com/en/pull-requests"]],
  s3: [["ESP8266 Arduino core documentation (boards, boot modes)", "https://arduino-esp8266.readthedocs.io/en/latest/"]],
  s5: [KICAD_DOCS],
  prac: [KICAD_DOCS],
  s8: [KICAD_DOCS],
  s12: [["ESP8266 Arduino core documentation", "https://arduino-esp8266.readthedocs.io/en/latest/"]],
  s13: [["JLCPCB parts library", "https://jlcpcb.com/parts"]],
  s14: [["Fabrication Toolkit plugin (README: fields, rotations)", "https://github.com/bennymeg/Fabrication-Toolkit"]]
};

/* ---------------------------------------------------------------------------
   State: the self-check boxes live in this browser. Acceptance lives on GitHub.
--------------------------------------------------------------------------- */
const LS_KEY = "meteo-course-progress-v1";
let state = { done: {} };
let current = 0;

function loadLocal() {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s && s.done) state.done = s.done; } catch (e) {}
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({ done: state.done })); } catch (e) {} }

const pad = (i) => String(i).padStart(2, "0");
const idx = (id) => STEPS.findIndex(x => x.id === id);
/* {{id}} in course text becomes that step's current number. */
const ref = (html) => html.replace(/\{\{(\w+)\}\}/g, (m, id) => { const i = idx(id); return i < 0 ? m : String(i); });
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* ---------------------------------------------------------------------------
   Rendering
--------------------------------------------------------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const checkId = (step, i) => step.id + "-" + i;
const stepCount = (step) => step.done.filter((_, i) => state.done[checkId(step, i)]).length;

function renderProgress() {
  const total = STEPS.reduce((n, s) => n + s.done.length, 0);
  const done = STEPS.reduce((n, s) => n + stepCount(s), 0);
  $("#overall-bar").style.width = (total ? done / total * 100 : 0) + "%";
  $("#overall-num").textContent = done + " / " + total + " checks";
}

function renderTray() {
  const tray = $("#tray"); tray.innerHTML = "";
  let phase = null, ol = null;
  STEPS.forEach((s, i) => {
    if (s.phase !== phase) {
      phase = s.phase;
      const h = document.createElement("div"); h.className = "phase-name"; h.textContent = phase; tray.append(h);
      ol = document.createElement("ol"); tray.append(ol);
    }
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#step-" + i;
    const c = stepCount(s);
    if (c === s.done.length) a.classList.add("full");
    if (i === current) a.setAttribute("aria-current", "page");
    a.innerHTML = `<span class="n">${String(i).padStart(2, "0")}</span><span>${s.title}${s.gate ? ' <span class="gate-dot" title="Mentor check">●</span>' : ""}</span><span class="c">${c}/${s.done.length}</span>`;
    li.append(a); ol.append(li);
  });
  const pick = $("#picker"); pick.innerHTML = "";
  STEPS.forEach((s, i) => {
    const o = document.createElement("option"); o.value = i;
    o.textContent = `${String(i).padStart(2, "0")} · ${s.title} (${stepCount(s)}/${s.done.length})`;
    if (i === current) o.selected = true; pick.append(o);
  });
}

function renderStep() {
  const s = STEPS[current], n = pad(current);
  const hints = s.hints.map((h, i) => `<details><summary>Hint ${i + 1}</summary><div><p>${ref(h)}</p></div></details>`).join("");
  const answers = s.answers ? `<details class="answers"><summary>Check your answers</summary><div>${ref(s.answers)}</div></details>` : "";
  const checks = s.done.map((d, i) => {
    const id = checkId(s, i);
    return `<li><label for="${id}"><input type="checkbox" id="${id}" data-check="${id}" ${state.done[id] ? "checked" : ""}><span>${d}</span></label></li>`;
  }).join("");
  const trouble = TROUBLE[s.id] ? `<h2>Common problems</h2><div class="tbl"><table><tr><th>You see</th><th>What it means and what to do</th></tr>${TROUBLE[s.id].map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</table></div>` : "";
  const learn = LEARN[s.id] ? `<h2>Learn more</h2><ul class="prose">${LEARN[s.id].map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${t}</a></li>`).join("")}</ul>` : "";

  const file = `course/submissions/step-${n}.md`;
  const deliver = (DELIVER[s.id] || []).map(d => `<li>${ref(d).replace(/NN/g, n)}</li>`).join("");
  const firstPr = idx("s2");
  let submit;
  if (current < firstPr) {
    submit = `<p>Fill in <code>${file}</code>:</p><ul class="prose">${deliver}</ul>
      <p>You send it to your mentor together with step ${pad(firstPr)}, in your first pull request.</p>`;
  } else {
    const br = "step-" + n;
    const title = s.id === "s2" ? `Steps 00–${n}: start` : `Step ${n}: ${s.title}`;
    const cmds = `# before you change anything: a new branch for this step
git switch main
git pull
git switch -c ${br}

# ... do the tasks and fill in ${file} ...

git status                 # check what will be saved
git add -A
git commit -m "${title}"
git push -u origin ${br}`;
    submit = `<p>Fill in <code>${file}</code>. Your mentor reads it in the pull request:</p><ul class="prose">${deliver}</ul>
      <p>Screenshots and photos go into <code>course/submissions/img/</code>.</p>
      <div class="commit"><pre><code id="submit-cmd">${esc(cmds)}</code></pre><button type="button" id="copy-submit">Copy</button></div>
      <ol class="prose">
        <li>On GitHub, click <b>Compare &amp; pull request</b>. Base: <code>main</code>. Title: <b>${esc(title)}</b>.</li>
        <li>Your mentor reviews it. <b>Approved and merged</b> = the step is accepted. <b>Changes requested</b> = read the comments, fix, then <code>git commit</code> and <code>git push</code> again on the same branch. The pull request updates by itself.</li>
        <li>After the merge: <code>git switch main</code>, <code>git pull</code>, and start the next step.</li>
      </ol>`;
  }

  const body = $("#step-body");
  body.innerHTML = `
    <div class="eyebrow">Step ${n} · ${s.phase}</div>
    <h1>${s.title}</h1>
    <div class="meta"><span>About ${s.time}</span>${s.gate ? '<span class="badge">Mentor check</span>' : ""}</div>
    <div class="goal"><b>Goal</b>${s.goal}</div>
    ${s.gate ? '<div class="gate"><b>Mentor check:</b> this step involves money, safety or a big decision. Discuss it with your mentor before you go on.</div>' : ""}
    <h2>Why it matters</h2><div class="prose">${ref(s.why)}</div>
    <h2>Tasks</h2><ol class="tasks prose">${s.tasks.map(t => `<li><div>${ref(t)}</div></li>`).join("")}</ol>
    <h2>Stuck?</h2><div>${hints}${answers}</div>
    ${trouble}
    ${learn}
    <h2>Accepted when</h2>
    <p class="small">Your mentor checks these before accepting the step. Tick them for yourself (saved in this browser).</p>
    <ul class="checks">${checks}</ul>
    <h2>Submit for review</h2>
    ${submit}
    <nav class="pager">
      ${current > 0 ? `<button type="button" id="prev">← ${pad(current - 1)} · ${STEPS[current - 1].title}</button>` : "<span></span>"}
      ${current < STEPS.length - 1 ? `<button type="button" class="primary" id="next">${pad(current + 1)} · ${STEPS[current + 1].title} →</button>` : ""}
    </nav>`;

  body.querySelectorAll("[data-check]").forEach(cb => cb.addEventListener("change", () => {
    state.done[cb.dataset.check] = cb.checked;
    saveLocal(); renderTray(); renderProgress();
  }));
  const cp = $("#copy-submit");
  if (cp) cp.addEventListener("click", () => {
    navigator.clipboard.writeText($("#submit-cmd").textContent).then(() => { cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy", 1500); })
      .catch(() => { const r = document.createRange(); r.selectNodeContents($("#submit-cmd")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); });
  });
  const prev = $("#prev"), next = $("#next");
  if (prev) prev.addEventListener("click", () => go(current - 1));
  if (next) next.addEventListener("click", () => go(current + 1));
}

function go(i) { location.hash = "step-" + i; }
function fromHash() {
  const m = /^#step-(\d+)$/.exec(location.hash);
  const i = m ? Math.min(Math.max(parseInt(m[1], 10), 0), STEPS.length - 1) : 0;
  const changed = i !== current; current = i;
  renderTray(); renderStep(); renderProgress();
  if (changed) window.scrollTo({ top: 0 });
}

/* ---------------------------------------------------------------------------
   Start
--------------------------------------------------------------------------- */
loadLocal();
window.addEventListener("hashchange", fromHash);
$("#picker").addEventListener("change", e => go(e.target.value));
fromHash();

</script>
</body></html>
