<!doctype html><html lang="uk"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a bench notebook. Sticky step list on the left like a parts tray,
   one step at a time on the right; silkscreen-style labels, soldermask green, copper for mentor checks. */
:root {
  --bg: #edf0eb;
  --surface: #fafbf8;
  --sunk: #e2e7e0;
  --ink: #17211c;
  --muted: #55645c;
  --line: #ccd6cf;
  --mask: #1c6845;
  --mask-ink: #ffffff;
  --mask-soft: #d8e9df;
  --copper: #9c5a1f;
  --copper-soft: #f4e4d3;
  --code-bg: #e5ebe4;
  --display: "IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1411; --surface: #131d18; --sunk: #0a0f0c; --ink: #e1e9e3; --muted: #93a49a;
    --line: #24322a; --mask: #5cc28d; --mask-ink: #05110a; --mask-soft: #173326;
    --copper: #e3a468; --copper-soft: #2c2118; --code-bg: #0f1814; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1411; --surface: #131d18; --sunk: #0a0f0c; --ink: #e1e9e3; --muted: #93a49a;
  --line: #24322a; --mask: #5cc28d; --mask-ink: #05110a; --mask-soft: #173326;
  --copper: #e3a468; --copper-soft: #2c2118; --code-bg: #0f1814; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--mask); }
code, kbd, pre { font-family: var(--mono); font-size: 0.88em; }
code { background: var(--code-bg); padding: 0.08em 0.35em; border-radius: 3px; overflow-wrap: anywhere; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 0.35em; background: var(--surface); }
pre { background: var(--code-bg); padding: 12px 14px; border-radius: 6px; overflow-x: auto; line-height: 1.5; margin: 0; }
pre code { background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--mask); outline-offset: 2px; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.topbar-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.35rem; letter-spacing: 0.02em; text-transform: uppercase; }
.brand span { color: var(--mask); }
.overall { flex: 1 1 260px; display: flex; align-items: center; gap: 12px; min-width: 0; }
.trace { flex: 1; height: 8px; background: var(--sunk); border-radius: 4px; position: relative; overflow: hidden; }
.trace i { position: absolute; inset: 0 auto 0 0; background: var(--copper); border-radius: 4px; transition: width .3s; }
.overall-num { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sync { font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-s="shared"]::before { background: var(--mask); }
.sync[data-s="local"]::before { background: var(--copper); }

.wrap {
  max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px;
}
.tray { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; max-height: calc(100vh - 96px); overflow-y: auto; padding-right: 4px; }
.phase-name { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.8rem; color: var(--muted); margin: 18px 0 6px; }
.phase-name:first-child { margin-top: 0; }
.tray ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.tray a {
  display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; align-items: baseline; gap: 6px;
  padding: 6px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 0.92rem; line-height: 1.35;
}
.tray a:hover { background: var(--sunk); }
.tray a[aria-current="page"] { background: var(--mask); color: var(--mask-ink); }
.tray .n { font-family: var(--mono); font-size: 0.8rem; opacity: 0.75; }
.tray .c { font-family: var(--mono); font-size: 0.75rem; opacity: 0.75; font-variant-numeric: tabular-nums; }
.tray a.full .c::after { content: " ✓"; }
.tray .gate-dot { color: var(--copper); }
.tray a[aria-current="page"] .gate-dot { color: inherit; }
.picker { display: none; }
.glink { font-size: 0.85rem; white-space: nowrap; }
.advice { padding: 12px 16px; border-radius: 8px; background: var(--copper-soft); }
.advice ul { margin: 0; padding-left: 1.2em; }
.advice li + li { margin-top: 6px; }

article { min-width: 0; max-width: 760px; }
.eyebrow { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.9rem; color: var(--mask); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.05; margin: 4px 0 10px; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 36px 0 10px; }
h3 { font-size: 1rem; margin: 20px 0 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 0.9rem; }
.badge { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.85rem; padding: 1px 8px; border-radius: 4px; background: var(--copper-soft); color: var(--copper); }
.goal { margin-top: 18px; padding: 14px 16px; background: var(--mask-soft); border-radius: 8px; }
.goal b { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.9rem; display: block; color: var(--mask); }
.gate { margin-top: 14px; padding: 12px 16px; border: 1px solid var(--copper); border-radius: 8px; background: var(--copper-soft); }
.gate b { color: var(--copper); }
.prose p, .prose li { max-width: 68ch; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li + li { margin-top: 6px; }
.tasks { counter-reset: t; list-style: none; padding: 0; display: grid; gap: 14px; }
.tasks > li { counter-increment: t; display: grid; grid-template-columns: 2em minmax(0, 1fr); gap: 4px 10px; }
.tasks > li::before { content: counter(t); font-family: var(--mono); font-weight: 500; color: var(--mask); border: 1.5px solid var(--mask); border-radius: 50%; width: 1.7em; height: 1.7em; display: grid; place-items: center; font-size: 0.85rem; margin-top: 0.1em; }
.tasks > li > * { grid-column: 2; }
.tasks > li > :first-child { grid-column: 2; grid-row: 1; margin-top: 0; }
.tasks p { margin: 0 0 6px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; font-size: 0.85rem; color: var(--muted); }
td code { white-space: nowrap; }

details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details + details { margin-top: 8px; }
summary { cursor: pointer; padding: 10px 14px; font-weight: 500; list-style: none; display: flex; gap: 8px; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+"; font-family: var(--mono); color: var(--mask); width: 1em; }
details[open] summary::before { content: "−"; }
details > div { padding: 0 16px 14px; }
details.answers summary { color: var(--copper); }
details.answers summary::before { color: var(--copper); }

.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.checks label { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.checks label:hover { background: var(--sunk); }
.checks input { appearance: none; width: 20px; height: 20px; margin: 2px 0 0; border: 2px solid var(--copper); border-radius: 3px; background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.checks input:checked { background: var(--copper); }
.checks input:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--surface); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.checks input:disabled { cursor: not-allowed; opacity: 0.6; }
.checks input:checked + span { color: var(--muted); }

.notes textarea { width: 100%; min-height: 140px; resize: vertical; font: inherit; font-size: 0.95rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.small { font-size: 0.85rem; color: var(--muted); }
.commit { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.commit pre { flex: 1 1 300px; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 14px; }
button:hover { border-color: var(--mask); }
button.primary { background: var(--mask); border-color: var(--mask); color: var(--mask-ink); font-weight: 500; }
button:disabled { opacity: 0.55; cursor: not-allowed; }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; flex-wrap: wrap; }
.pager button { max-width: 100%; text-align: left; }

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 16px 48px; }
  .tray { display: none; }
  .picker { display: block; }
  .picker select { width: 100%; font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
}
@media (prefers-reduced-motion: reduce) { .trace i { transition: none; } }
</style>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Курс <span>Метеостанція</span></div>
    <div class="overall" aria-label="Загальний прогрес">
      <div class="trace"><i id="overall-bar" style="width:0%"></i></div>
      <span class="overall-num" id="overall-num">0 / 0 позначок</span>
    </div>
    <a class="glink" href="#design">Схема v2</a> <a class="glink" href="#glossary">Словник EN → UK</a>
    <div class="sync" id="sync" data-s="local">Твої позначки зберігаються в цьому браузері. Кроки приймає наставник на GitHub.</div>

</header>

<div class="wrap">
  <nav class="tray" id="tray" aria-label="Кроки курсу"></nav>
  <article id="step" aria-live="polite">
    <div class="picker"><label class="small" for="picker">Перейти до кроку</label><select id="picker"></select></div>
    <div id="step-body"></div>
  </article>
</div>

<script>
/* ---------------------------------------------------------------------------
   Course content. Each step: phase, title, time, goal, why (HTML), tasks (HTML list items),
   hints (HTML strings, opened one by one), answers (optional HTML), done (checklist), commit.
   Paths are relative to the repository root (projectmeteo/).
--------------------------------------------------------------------------- */
const STEPS = [
{
  id: "s0", phase: "Початок", title: "Як працює цей курс", time: "15 хв",
  goal: "Знати, як користуватися курсом і де лежить твій проєкт.",
  why: `<p>Ти розробив цю метеостанцію. Тепер ти перетвориш її на продукт, який для тебе виготовить завод: справжню плату з уже напаяними компонентами (це називається <b>PCBA</b>, збирання друкованої плати). У кінці в тебе в руках будуть прототипи, а пізніше — невелика серія, яку можна продавати.</p>
  <p>Кожен крок має однакові частини:</p>
  <ul>
    <li><b>Мета</b>: що в тебе буде в кінці кроку.</li>
    <li><b>Навіщо це</b>: ідея, яка стоїть за кроком.</li>
    <li><b>Завдання</b>: що робити, по порядку.</li>
    <li><b>Підказки</b>: відкривай по одній і тільки тоді, коли застряг. Спершу спробуй сам 15–20 хвилин.</li>
    <li><b>Перевір свої відповіді</b>: порівнюй, коли вже маєш власну відповідь, а не до того.</li>
    <li><b>Прийнято, коли</b>: що перевіряє наставник, перш ніж прийняти крок. Познач для себе, що вже готово.</li>
    <li><b>Здати на перевірку</b>: кожен крок закінчується файлом, який ти заповнюєш (<code>submissions/step-NN.md</code>), і <b>pull request</b> на GitHub. Наставник читає його і або приймає крок, або повертає з коментарями. Тоді ти виправляєш і надсилаєш знову. Саме так працюють інженери в справжніх компаніях.</li>
    <li><b>Поради</b>: практичні поради, які дав би тобі інженер.</li>
    <li><b>Словник</b>: незнайоме англійське слово? У словнику (вгорі сторінки) є переклад.</li>
    <li><b>Підказки не допомогли?</b> Запитай наставника в Telegram. Напиши, який крок, що ти пробував, і додай скріншот.</li>
  </ul>
  <p>Кроки з позначкою <span class="badge">Перевірка наставника</span> стосуються грошей, безпеки або великого рішення. Обговори їх із наставником у pull request або в Telegram, перш ніж іти далі.</p>
  <p>По одному кроку: починай наступний тільки після того, як наставник прийняв попередній.</p>`,
  tasks: [
    `<p>Прочитай цю сторінку, потім відкрий список кроків і переглянь їх усі. Шлях довгий, але кожен крок невеликий.</p>`,
    `<p>Знайди папку проєкту на своєму комп'ютері. Вона має таку структуру:</p>
<pre><code>electronic-device-course/
├── index.html         цей курс (працює без інтернету)
├── README.md          опис проєкту, перші кроки, як проходить кожен крок
├── MENTOR.md          інструкція для наставника
├── pcb/               проєкт KiCad: last-version.kicad_pro
├── firmware/          projectcpcs_v2/projectcpcs_v2.ino (код для Arduino)
├── submissions/       по одному файлу на крок, які ти заповнюєш
├── practice/          твоя тренувальна плата (крок {{prac}})
├── tools/             допоміжний скрипт для курсу
└── .github/           шаблон для pull request</code></pre>`,
    `<p>Відкрий <code>submissions/step-00.md</code> і напиши, чого ти найбільше хочеш навчитися в цьому проєкті. Ти надішлеш це наставнику на кроці {{s2}}.</p>`
  ],
  hints: [
    `Це та папка, куди ти зробив git clone (README, розділ «Перші кроки»). Не пам'ятаєш, де вона? У VS Code: <b>File → Open Recent</b>. Або запитай наставника.`
  ],
  done: ["Я прочитав, як працює курс", "Я знаю, де лежать pcb і firmware", "Я написав у step-00.md, чого хочу навчитися"]
},
{
  id: "s1", phase: "Початок", title: "Перевір інструменти", time: "20 хв",
  goal: "Твій KiCad версії 10, і проєкт v2 відкривається без помилок.",
  why: `<p>KiCad і VS Code у тебе вже є. Треба перевірити одне: проєкт v2 збережено в <b>KiCad 10</b>. Старіші версії KiCad не відкривають файли з новіших, тому твій KiCad має бути версії 10 або новішої.</p>
  <p>Проєкт також використовує дві власні бібліотеки (модуль ESP-12F і тримач акумулятора). Вони лежать усередині папки проєкту, тому KiCad знаходить їх, тільки коли ти відкриваєш файл проєкту (<code>.kicad_pro</code>), а не окремо файл схеми.</p>`,
  tasks: [
    `<p>У KiCad відкрий <b>Help → About KiCad</b> і подивись версію. Якщо вона менша за 10, онови її з <a href="https://www.kicad.org/download/" target="_blank" rel="noopener">kicad.org/download</a>.</p>`,
    `<p>Переключи KiCad на англійську: <b>Preferences → Set Language → English</b>, потім перезапусти KiCad. У цьому курсі, у документації та в більшості відео й форумів меню називаються англійською. Якщо твій KiCad українською, це налаштування в тому самому меню — у тому, що ліворуч від «Довідка».</p>`,
    `<p>Відкрий <code>pcb/last-version.kicad_pro</code> у KiCad (подвійний клік або <b>File → Open Project</b>).</p>`,
    `<p>Відкрий <b>Schematic Editor</b> (редактор схеми) і <b>PCB Editor</b> (редактор плати). У редакторі плати натисни <kbd>Alt</kbd>+<kbd>3</kbd>, щоб відкрити 3D-перегляд, і подивись на обидва боки плати.</p>`,
    `<p>У VS Code відкрий усю папку <code>electronic-device-course</code> (<b>File → Open Folder</b>). Вона знадобиться для прошивки і для git.</p>`
  ],
  hints: [
    `KiCad пише, що бракує символу чи посадкового місця? Мабуть, ти відкрив файл <code>.kicad_sch</code> напряму. Закрий його і відкрий файл <code>.kicad_pro</code>.`,
    `KiCad пише, що файл створено в новішій версії? Значить, твій KiCad застарий: онови його.`,
    `У 3D-перегляді деякі компоненти можуть бути без 3D-моделі. Поки що це нормально, на саму плату це не впливає.`
  ],
  done: ["Мій KiCad версії 10 або новішої", "KiCad переключено на англійську", "Проєкт v2 відкривається без помилок про бібліотеки", "Папка electronic-device-course відкрита у VS Code"]
},
{
  id: "s2", phase: "Початок", title: "Git і GitHub: твій перший pull request", time: "2 год",
  goal: "Ти вмієш робити крок в окремій гілці, надсилати її на GitHub і відкривати pull request, щоб наставник його перевірив.",
  why: `<p><b>Git</b> запам'ятовує кожну збережену версію твоїх файлів. Якщо щось зламаєш — повернешся назад. А коли замовлятимеш плати, зможеш позначити саме ту версію, яку відправив на завод.</p>
  <p>Проєкт і цей курс лежать у репозиторії на GitHub: <code>sulim-vladimir/electronic-device-course</code>. Наставник додає тебе як учасника (collaborator). Досі ти завантажував файли через сайт GitHub. Відтепер ти працюєш із git на своєму комп'ютері, як професійні розробники.</p>
  <p>Слова, які знадобляться:</p>
  <ul>

                ├── SW1 (кнопка Reset) ── GND
                └── R14 1k ── GPIO16 (вивід 4 ESP)</code></pre>
  <p>ESP вважає RESET «низьким», коли на ньому менше ніж приблизно 0,25 × 3,3 В ≈ 0,83 В.</p>`,
  tasks: [
    `<p>Коли GPIO16 тягне вниз, R1 і R14 утворюють <b>дільник напруги</b>. Обчисли напругу на RESET при R14 = 1 кОм. Чи перезапуститься ESP?</p>`,
    `<p>Тепер обчисли для R14 = 10 кОм. Чи перезапуститься ESP?</p>`,
    `<p>Чому не з'єднати GPIO16 з RESET просто дротом? Подумай, що буде, якщо натиснути <code>SW1</code>, коли GPIO16 видає високий рівень.</p>`,
    `<p>Час роботи від акумулятора: станція не спить 8 с при 80 мА, потім спить 592 с при 0,03 мА (30 µA). Обчисли <b>середній струм</b> і скільки днів протримається акумулятор на 2500 мА·год.</p>`,
    `<p>Яка частина циклу забирає більше енергії: робота чи сон? Що б ти змінив, щоб акумулятор тримав довше?</p>`
  ],
  hints: [
    `Дільник напруги: V = 3,3 В × R14 ÷ (R1 + R14).`,
    `Заряд за цикл = струм × час. Додай частину роботи і частину сну, потім поділи на тривалість циклу (600 с).`,
    `мА × с ÷ с = мА. Години роботи = 2500 мА·год ÷ середній струм у мА. Поділи на 24, щоб отримати дні.`
  ],
  answers: `<ul>
<li>R14 = 1 кОм: 3,3 × 1 ÷ 11 = <b>0,30 В</b>, значно нижче 0,83 В, тож ESP перезапускається.</li>
<li>R14 = 10 кОм: 3,3 × 10 ÷ 20 = <b>1,65 В</b>, забагато, тож перезапуску немає і станція ніколи не прокинеться.</li>
<li>З прямим дротом кнопка Reset замикала б GPIO16 на GND, поки він видає високий рівень. R14 обмежує цей струм до приблизно 3,3 мА.</li>
<li>Робота: 80 × 8 = 640 мА·с. Сон: 0,03 × 592 ≈ 17,8 мА·с. Разом ≈ 658 мА·с за 600 с, тобто в середньому близько <b>1,1 мА</b>. 2500 ÷ 1,1 ≈ 2270 год ≈ <b>95 днів</b>.</li>
<li>Робота забирає близько 97 % енергії. Коротший час роботи (швидше підключення до Wi-Fi, менше затримок) допомагає набагато більше, ніж менший струм сну.</li>
</ul>`,
  done: ["Я обчислив напругу на RESET для 1 кОм і 10 кОм", "Я обчислив час роботи від акумулятора", "Я можу пояснити, навіщо потрібен R14, у 2–3 реченнях"]

  why: `<p>Стабілізатор <code>U9</code> (HT7333) перетворює напругу акумулятора на стабільні 3,3 В. Він розрахований на <b>250 мА</b>. Коли ESP передає дані по Wi-Fi, вона бере короткі піки струму, які можуть бути більшими. Зі слабким акумулятором напруга просідає, і ESP перезапускається. На одній платі ти можеш цього ніколи не побачити. На 50 платах деякі так робитимуть.</p>

  why: `<p>Правильно виміряти температуру повітря — головна робота метеостанції. Це складніше, ніж здається. У закритому корпусі сонце й електроніка гріють повітря, тож показання можуть бути на кілька градусів завищені. Справжні метеостанції міряють у тіні, з повітрям, що обтікає датчик, усередині білої захисної будки.</p>

    `<p>Для питання 2 зроби порівняльну таблицю щонайменше з двох варіантів: ціна, наскільки добре тримає воду, чи можна замінити щуп, не відкриваючи корпус, наскільки складно збирати.</p>`,
    `<p>Рекомендований експеримент: поклади будь-який термометр (або плату v1) у закриту коробку на сонці на 30 хвилин, а інший — у тінь надворі. Записуй обидві температури кожні 10 хвилин.</p>`,

  why: `<p>Зараз більшість з'єднань — прості штирові лінійки (pin headers). На прототипі на столі це нормально, але продукту потрібно більше: покупець підключатиме кабель заряджання в темряві, а вітер смикатиме кабель щупа. Поганий вибір роз'єму може переплутати полярність акумулятора або дати кабелю випасти.</p>

  <tr><td><code>SW3</code>, <code>SW4</code>, <code>SW5</code></td><td>Перемичка Mode, перемичка Protection, вимикач живлення</td><td>2-контактні лінійки</td></tr>

  <p>Що робить роз'єм правильним для задачі:</p>

const LS_KEY = "meteo-course-progress-v1";
let state = { done: {} };
let current = 0;

function loadLocal() {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s && s.done) state.done = s.done; } catch (e) {}
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({ done: state.done })); } catch (e) {} }

const pad = (i) => String(i).padStart(2, "0");
const idx = (id) => STEPS.findIndex(x => x.id === id);
/* {{id}} in course text becomes that step's current number. */
const ref = (html) => html.replace(/\{\{(\w+)\}\}/g, (m, id) => { const i = idx(id); return i < 0 ? m : String(i); });
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* ---------------------------------------------------------------------------
   Rendering
--------------------------------------------------------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const checkId = (step, i) => step.id + "-" + i;
const stepCount = (step) => step.done.filter((_, i) => state.done[checkId(step, i)]).length;
const PAGES = ["#glossary", "#design"];

function renderProgress() {
  const total = STEPS.reduce((n, s) => n + s.done.length, 0);
  const done = STEPS.reduce((n, s) => n + stepCount(s), 0);
  $("#overall-bar").style.width = (total ? done / total * 100 : 0) + "%";
  $("#overall-num").textContent = done + " / " + total + " позначок";
}

function renderTray() {
  const tray = $("#tray"); tray.innerHTML = "";
  const onPage = PAGES.includes(location.hash);
  let phase = null, ol = null;
  STEPS.forEach((s, i) => {
    if (s.phase !== phase) {
      phase = s.phase;
      const h = document.createElement("div"); h.className = "phase-name"; h.textContent = phase; tray.append(h);
      ol = document.createElement("ol"); tray.append(ol);
    }
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#step-" + i;
    const c = stepCount(s);
    if (c === s.done.length) a.classList.add("full");
    if (i === current && !onPage) a.setAttribute("aria-current", "page");
    a.innerHTML = `<span class="n">${pad(i)}</span><span>${s.title}${s.gate ? ' <span class="gate-dot" title="Перевірка наставника">●</span>' : ""}</span><span class="c">${c}/${s.done.length}</span>`;
    li.append(a); ol.append(li);
  });
  const g = document.createElement("div"); g.className = "phase-name"; g.textContent = "Довідка"; tray.append(g);
  const gl = document.createElement("ol");
  const cur = (h) => location.hash === h ? ' aria-current="page"' : "";
  gl.innerHTML = `<li><a href="#design"${cur("#design")}><span class="n">v2</span><span>Схема v2: що в ній і чому</span><span class="c"></span></a></li>
    <li><a href="#glossary"${cur("#glossary")}><span class="n">EN</span><span>Словник: English → Українська</span><span class="c"></span></a></li>`;
  tray.append(gl);
  const pick = $("#picker"); pick.innerHTML = "";
  STEPS.forEach((s, i) => {
    const o = document.createElement("option"); o.value = i;
    o.textContent = `${pad(i)} · ${s.title} (${stepCount(s)}/${s.done.length})`;
    if (i === current) o.selected = true; pick.append(o);
  });
}

function renderStep() {
  const s = STEPS[current], n = pad(current);
  const hints = s.hints.map((h, i) => `<details><summary>Підказка ${i + 1}</summary><div><p>${ref(h)}</p></div></details>`).join("");
  const answers = s.answers ? `<details class="answers"><summary>Перевір свої відповіді</summary><div>${ref(s.answers)}</div></details>` : "";
  const checks = s.done.map((d, i) => {
    const id = checkId(s, i);
    return `<li><label for="${id}"><input type="checkbox" id="${id}" data-check="${id}" ${state.done[id] ? "checked" : ""}><span>${d}</span></label></li>`;
  }).join("");
  const trouble = TROUBLE[s.id] ? `<h2>Типові проблеми</h2><div class="tbl"><table><tr><th>Що бачиш</th><th>Що це означає і що робити</th></tr>${TROUBLE[s.id].map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</table></div>` : "";
  const learn = LEARN[s.id] ? `<h2>Більше матеріалів</h2><ul class="prose">${LEARN[s.id].map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${t}</a></li>`).join("")}</ul>` : "";

  const file = `submissions/step-${n}.md`;
  const deliver = (DELIVER[s.id] || []).map(d => `<li>${ref(d).replace(/NN/g, n)}</li>`).join("");
  const firstPr = idx("s2");
  let submit;
  if (current < firstPr) {
    submit = `<p>Заповни <code>${file}</code>:</p><ul class="prose">${deliver}</ul>
      <p>Ти надішлеш його наставнику разом із кроком ${pad(firstPr)}, у своєму першому pull request.</p>`;
  } else {
    const br = "step-" + n;
    const title = s.id === "s2" ? `Кроки 00–${n}: старт` : `Крок ${n}: ${s.title}`;
    const cmds = `# перед будь-якими змінами: нова гілка для цього кроку
git switch main
git pull
git switch -c ${br}

# ... виконай завдання і заповни ${file} ...

git status                 # перевір, що буде збережено
git add -A
git commit -m "${title}"
git push -u origin ${br}`;
    submit = `<p>Заповни <code>${file}</code>. Наставник читатиме його в pull request:</p><ul class="prose">${deliver}</ul>
      <p>Скріншоти і фото клади в <code>submissions/img/</code>.</p>
      <div class="commit"><pre><code id="submit-cmd">${esc(cmds)}</code></pre><button type="button" id="copy-submit">Копіювати</button></div>
      <ol class="prose">
        <li>На GitHub натисни <b>Compare &amp; pull request</b>. Base: <code>main</code>. Назва: <b>${esc(title)}</b>.</li>
        <li>Наставник перевіряє. <b>Approved і merged</b> — крок прийнято. <b>Changes requested</b> — прочитай коментарі, виправ, потім <code>git commit</code> і <code>git push</code> у ту саму гілку. Pull request оновиться сам.</li>
        <li>Після злиття: <code>git switch main</code>, <code>git pull</code> — і починай наступний крок.</li>
      </ol>`;
  }

  const body = $("#step-body");
  body.innerHTML = `
    <div class="eyebrow">Крок ${n} · ${s.phase}</div>
    <h1>${s.title}</h1>
    <div class="meta"><span>Приблизно ${s.time}</span>${s.gate ? '<span class="badge">Перевірка наставника</span>' : ""}</div>
    <div class="goal"><b>Мета</b>${s.goal}</div>
    ${s.gate ? '<div class="gate"><b>Перевірка наставника:</b> цей крок стосується грошей, безпеки або великого рішення. Обговори його з наставником, перш ніж іти далі.</div>' : ""}
    <h2>Навіщо це</h2><div class="prose">${ref(s.why)}</div>
    <h2>Завдання</h2><ol class="tasks prose">${s.tasks.map(t => `<li><div>${ref(t)}</div></li>`).join("")}</ol>
    ${TIPS[s.id] ? `<h2>Поради</h2><div class="advice"><ul>${TIPS[s.id].map(t => `<li>${t}</li>`).join("")}</ul></div>` : ""}
    <h2>Застряг?</h2><div>${hints}${answers}</div>
    ${trouble}
    ${learn}
    <h2>Прийнято, коли</h2>
    <p class="small">Це наставник перевіряє, перш ніж прийняти крок. Позначай для себе (зберігається в цьому браузері).</p>
    <ul class="checks">${checks}</ul>
    <h2>Здати на перевірку</h2>
    ${submit}
    <nav class="pager">
      ${current > 0 ? `<button type="button" id="prev">← ${pad(current - 1)} · ${STEPS[current - 1].title}</button>` : "<span></span>"}
      ${current < STEPS.length - 1 ? `<button type="button" class="primary" id="next">${pad(current + 1)} · ${STEPS[current + 1].title} →</button>` : ""}
    </nav>`;

  body.querySelectorAll("[data-check]").forEach(cb => cb.addEventListener("change", () => {
    state.done[cb.dataset.check] = cb.checked;
    saveLocal(); renderTray(); renderProgress();
  }));
  const cp = $("#copy-submit");
  if (cp) cp.addEventListener("click", () => {
    navigator.clipboard.writeText($("#submit-cmd").textContent).then(() => { cp.textContent = "Скопійовано"; setTimeout(() => cp.textContent = "Копіювати", 1500); })
      .catch(() => { const r = document.createRange(); r.selectNodeContents($("#submit-cmd")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); });
  });
  const prev = $("#prev"), next = $("#next");
  if (prev) prev.addEventListener("click", () => go(current - 1));
  if (next) next.addEventListener("click", () => go(current + 1));
}

function go(i) { location.hash = "step-" + i; }

function backButton() {
  return `<nav class="pager"><button type="button" class="primary" id="back">← Назад до кроку ${pad(current)}</button></nav>`;
}

function renderGlossary() {
  $("#step-body").innerHTML = `
    <div class="eyebrow">Довідка · English → Українська</div>
    <h1>Словник термінів</h1>
    <p class="prose">KiCad, даташити, JLCPCB і GitHub говорять англійською. Ці слова ти бачитимеш у меню і в документації, тож тут вони з перекладом і поясненням.</p>
    <div class="tbl"><table>
      <tr><th>English</th><th>Українська</th><th>Що це означає</th></tr>
      ${GLOSSARY.map(([en, uk, d]) => `<tr><td lang="en"><b>${en}</b></td><td>${uk}</td><td>${d}</td></tr>`).join("")}
    </table></div>
    ${backButton()}`;
  $("#back").addEventListener("click", () => go(current));
}

function renderDesign() {
  $("#step-body").innerHTML = `
    <div class="eyebrow">Довідка · версія 2</div>
    <h1>Схема v2: що в ній і чому</h1>
    <div class="prose">${ref(DESIGN)}</div>
    ${backButton()}`;
  $("#back").addEventListener("click", () => go(current));
}

function fromHash() {
  if (PAGES.includes(location.hash)) {
    renderTray(); renderProgress();
    if (location.hash === "#glossary") renderGlossary(); else renderDesign();
    window.scrollTo({ top: 0 });
    return;
  }
  const m = /^#step-(\d+)$/.exec(location.hash);
  const i = m ? Math.min(Math.max(parseInt(m[1], 10), 0), STEPS.length - 1) : 0;
  const changed = i !== current; current = i;
  renderTray(); renderStep(); renderProgress();
  if (changed) window.scrollTo({ top: 0 });
}

/* ---------------------------------------------------------------------------
   Start
--------------------------------------------------------------------------- */
loadLocal();
window.addEventListener("hashchange", fromHash);
$("#picker").addEventListener("change", e => go(e.target.value));
fromHash();

</script>
</body></html>
